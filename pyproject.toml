[project]
name = "dataquantum-load-csv"
version = "0.2.1"
description = "Python package for reading CSV files"
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
keywords = ["CSV", "DataFrame", "dataquantum"]
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)"
]

[tool.poetry]
packages = [{include = "dataquantum_load_csv", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.taskipy.tasks]
pytest = "poetry run pytest ."
covhtml = "poetry run pytest --cov=dataquantum_load_csv --cov-report=html"
covcmd = "poetry run pytest --cov=dataquantum_load_csv --cov-report=term-missing"
format = "poetry run ruff format ."
lint = "poetry run ruff check ."
mypy = "poetry run mypy src"
check = "poetry run ruff check . && poetry run ruff format --check ."
precommit = "poetry run pre-commit run --all-files"
fix = "poetry run ruff check . --fix"
release-check = "poetry run ruff check . && poetry run ruff format --check . && poetry run mypy src && poetry run pytest --cov=dataquantum_yaml_reader --cov-report=term-missing --cov-fail-under=90 && poetry build"
